# Laravel + Livewire/Flux dynamic routes
# ^~ prefix locations win over the base image's static-asset regex (\.js$ -> try_files =404)
location ^~ /livewire- {
    try_files $uri $uri/ /index.php?$query_string;
}

location ^~ /flux/ {
    expires off;
    try_files $uri $uri/ /index.php?$query_string;
}
